# Render Blueprint. Apply from the Render dashboard: New + Blueprint.
# After the first deploy, set CORS_ORIGIN and PUBLIC_URL to the service URL
# (https://<service>.onrender.com) and turn Auto-Deploy to "After CI passes".
databases:
  - name: home-workout-db
    databaseName: homeworkout
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: home-workout
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: home-workout-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_URL
        sync: false
